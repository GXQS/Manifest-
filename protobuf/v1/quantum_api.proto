syntax = "proto3";

package gxqs.quantum.v1;

option go_package = "github.com/GXQS/SDK/protobuf/gen/go/quantum/v1;quantumv1";

message Address {
  bytes value = 1; // must be exactly 32 bytes
}

message Hash {
  bytes value = 1; // must be exactly 32 bytes
}

message Signature {
  bytes value = 1;
  string algorithm = 2; // expected: ML-DSA-44, ML-DSA-65, or ML-DSA-87
}

message Transaction {
  uint64 chain_id = 1;
  uint64 nonce = 2;
  Address from = 3;
  Address to = 4;
  uint64 gas_limit = 5;
  uint64 max_fee_per_gas = 6;
  bytes data = 7;
  bytes pqc_payload = 8;
  Signature signature = 9;
}

message BlockHeader {
  uint64 height = 1;
  Hash parent_hash = 2;
  Hash state_root = 3;
  Hash tx_root = 4;
  uint64 timestamp_unix = 5;
  uint64 proposer_index = 6;
  uint64 epoch = 7;
  uint64 view = 8;
}

message Block {
  BlockHeader header = 1;
  repeated Transaction transactions = 2;
  Signature quorum_certificate = 3;
}
